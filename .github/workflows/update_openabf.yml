name: Update OpenABF

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openabf-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check for new OpenABF release
    # For repository_dispatch, skip release candidates
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.is_rc != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Get latest OpenABF release tag
        id: latest
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            tag="${{ github.event.client_payload.tag }}"
          else
            tag=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/educelab/OpenABF/releases/latest \
              | jq -r '.tag_name')
          fi
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "Error: failed to retrieve latest OpenABF release tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Get current GIT_TAG from cmake/BuildOpenABF.cmake
        id: current
        run: |
          tag=$(grep -oP '(?<=GIT_TAG\s)[\w./\-]+' cmake/BuildOpenABF.cmake)
          if [[ -z "${tag}" ]]; then
            echo "Error: failed to extract GIT_TAG from cmake/BuildOpenABF.cmake" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update GIT_TAG in cmake/BuildOpenABF.cmake
        if: steps.latest.outputs.tag != steps.current.outputs.tag
        env:
          NEW_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          sed -i "s|\(GIT_TAG\s\+\)\S\+|\1${NEW_TAG}|" cmake/BuildOpenABF.cmake

      - name: Open pull request
        if: steps.latest.outputs.tag != steps.current.outputs.tag
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/update-openabf-${{ steps.latest.outputs.tag }}
          base: develop
          title: "Update OpenABF ${{ steps.latest.outputs.tag }}"
          body: |
            Bumps the pinned OpenABF version in `cmake/BuildOpenABF.cmake` from `${{ steps.current.outputs.tag }}` to `${{ steps.latest.outputs.tag }}`.

            See the [OpenABF ${{ steps.latest.outputs.tag }} release](https://github.com/educelab/OpenABF/releases/tag/${{ steps.latest.outputs.tag }}) for details.
          commit-message: "ci: update OpenABF GIT_TAG to ${{ steps.latest.outputs.tag }}"
          labels: dependencies
