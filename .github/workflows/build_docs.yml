# Simple workflow for deploying static content to GitHub Pages
name: Build and deploy docs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["develop"]

  # Runs on pull requests to develop
  pull_request:
    branches:
      - "develop"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    container: ghcr.io/educelab/ci-docker:static.12.2
    timeout-minutes: 180
    env:
      CMAKE_PREFIX_PATH: "/usr/local/Qt-6.10.0/"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install documentation requirements
        run: |
          apt-get -y update
          apt-get install --fix-missing --fix-broken -y doxygen graphviz

      # smgl and libcore aren't packaged for apt or bundled in ci-docker, so build
      # them from source for find_package(). This is a static build, so static deps.
      - name: Install smgl and libcore
        run: |
          apt-get install -y --no-install-recommends curl nlohmann-json3-dev
          mkdir -p /tmp/smgl && curl -fsSL https://github.com/educelab/smgl/archive/refs/tags/v0.11.0-rc.2.tar.gz | tar -xz --strip-components=1 -C /tmp/smgl
          cmake -S /tmp/smgl -B /tmp/smgl/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DSMGL_BUILD_JSON=OFF -DSMGL_USE_BOOSTFS=OFF -DSMGL_BUILD_TESTS=OFF -DSMGL_BUILD_DOCS=OFF
          cmake --build /tmp/smgl/build && cmake --install /tmp/smgl/build
          mkdir -p /tmp/libcore && curl -fsSL https://github.com/educelab/libcore/archive/refs/tags/v0.3.0-rc.1.tar.gz | tar -xz --strip-components=1 -C /tmp/libcore
          cmake -S /tmp/libcore -B /tmp/libcore/build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DEDUCE_CORE_BUILD_TESTS=OFF -DEDUCE_CORE_BUILD_DOCS=OFF -DEDUCE_CORE_BUILD_EXAMPLES=OFF
          cmake --build /tmp/libcore/build && cmake --install /tmp/libcore/build
          ldconfig

      - name: Build documentation
        run: |
          cmake -S . -B build/ -GNinja -DVC_BUILD_DOCS=ON -DVC_BUILD_APPS=OFF -DVC_BUILD_UTILS=OFF
          cmake --build build/ --target docs
          mv build/docs/html/ public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
          
  deploy:
    name: Deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref_name == 'develop' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
