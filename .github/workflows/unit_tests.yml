name: Unit tests
on:
  workflow_dispatch:
  push:
    branches: ["develop"]
  pull_request:
    branches:
      - "develop"

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  debian:
    name: Debian
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - version: "12.2"
          - version: "13.0"
        build:
          - type: "static"
          - type: "dynamic"
            cmake_flags: "-DBUILD_SHARED_LIBS=ON"
    container: ghcr.io/educelab/ci-docker:${{ matrix.build.type }}.${{ matrix.image.version }}
    timeout-minutes: 180
    env:
      EXTRA_CMAKE_FLAGS: ${{ matrix.build.cmake_flags }}
      CMAKE_PREFIX_PATH: "/usr/local/Qt-6.10.0/"
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build volume-cartographer
      run: |
        cmake -S . -B build/ -GNinja -DVC_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVC_BUILD_TESTS=ON $EXTRA_CMAKE_FLAGS
        cmake --build build/

    - name: Run tests
      run: ctest -V --test-dir build/

  macOS:
    name: macOS
    strategy:
      matrix:
        os:
          - version: "15"
            exclude_sdk: "14"
          - version: "26"
            exclude_sdk: "{14..15}"
    runs-on: macos-${{ matrix.os.version }}
    timeout-minutes: 180
    env:
      EXTRA_CMAKE_FLAGS: "-DVC_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVC_BUILD_TESTS=ON -DVC_BUILD_JSON=OFF"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Remove problematic SDKs
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools/SDKs/MacOSX${{ matrix.os.exclude_sdk }}*.sdk

      # Homebrew's fmt 12.2.0 broke compilation against spdlog (a Brewfile
      # dependency). Pin fmt to the last compatible release until spdlog
      # supports fmt 12.2.0. Tracking issue: educelab/volume-cartographer#147
      - name: Pin fmt to 12.1.0 (workaround for spdlog/fmt 12.2.0 incompatibility)
        run: |
          brew install https://raw.githubusercontent.com/Homebrew/homebrew-core/8c1fead169ea138bf6e0aec848593c7abe8ec482/Formula/f/fmt.rb
          brew pin fmt

      - name: Install dependencies
        run: |
          brew bundle
          brew install ninja

      - name: Build volume-cartographer
        run: |
          cmake -S . -B build/ -GNinja $EXTRA_CMAKE_FLAGS
          cmake --build build/

      - name: Run tests
        run: ctest -V --test-dir build/