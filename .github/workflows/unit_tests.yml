name: Unit tests
on:
  workflow_dispatch:
  push:
    branches: ["develop"]
  pull_request:
    branches:
      - "develop"

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  debian:
    name: Debian
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - version: "12.2"
        build:
          - type: "static"
            cmake_flags: "-DVC_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVC_BUILD_TESTS=ON"
          - type: "dynamic"
            cmake_flags: "-DBUILD_SHARED_LIBS=ON -DVC_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVC_BUILD_TESTS=ON"
    container: ghcr.io/educelab/ci-docker:${{ matrix.build.type }}.${{ matrix.image.version }}
    if: ${{ github.event_name }} == "merge_request_event" || !(${{ github.ref }} && $CI_OPEN_MERGE_REQUESTS) || ${{ github.ref }}
    timeout-minutes: 180
    env:
      EXTRA_CMAKE_FLAGS: ${{ matrix.build.cmake_flags }}
      CMAKE_PREFIX_PATH: "/usr/local/Qt-6.10.0/"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build volume-cartographer
      run: |
        cmake -S . -B build/ -GNinja $EXTRA_CMAKE_FLAGS
        cmake --build build/

    - name: Run tests
      run: ctest -V --test-dir build/

  macos_15:
    name: macOS 15
    runs-on: macos-15
    if: ${{ github.event_name }} == "merge_request_event" || !(${{ github.ref }} && $CI_OPEN_MERGE_REQUESTS) || ${{ github.ref }}
    timeout-minutes: 180
    env:
      EXTRA_CMAKE_FLAGS: "-DVC_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVC_BUILD_TESTS=ON -DVC_BUILD_JSON=OFF"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Remove problematic SDKs
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools/SDKs/MacOSX14*.sdk

      - name: Install dependencies
        run: |
          brew bundle
          brew install ninja

      - name: Build volume-cartographer
        run: |
          cmake -S . -B build/ -GNinja $EXTRA_CMAKE_FLAGS
          cmake --build build/

      - name: Run tests
        run: ctest -V --test-dir build/

  macos_26:
    name: macOS 26
    runs-on: macos-26
    if: ${{ github.event_name }} == "merge_request_event" || !(${{ github.ref }} && $CI_OPEN_MERGE_REQUESTS) || ${{ github.ref }}
    timeout-minutes: 180
    env:
      EXTRA_CMAKE_FLAGS: "-DVC_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVC_BUILD_TESTS=ON -DVC_BUILD_JSON=OFF"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Remove problematic SDKs
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools/SDKs/MacOSX{14..15}*.sdk

      - name: Install dependencies
        run: |
          brew bundle
          brew install ninja

      - name: Build volume-cartographer
        run: |
          cmake -S . -B build/ -GNinja $EXTRA_CMAKE_FLAGS
          cmake --build build/

      - name: Run tests
        run: ctest -V --test-dir build/